name: Python Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  discover-packages:
    name: Discover Python Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Find packages with tests
        id: find
        run: |
          shopt -s nullglob
          # Space-separated packages to skip on purpose, with a comment per entry
          EXCLUDE=""
          names=()
          for tests_dir in packages/*/tests; do
            pkg=$(basename "$(dirname "$tests_dir")")
            [[ " $EXCLUDE " == *" $pkg "* ]] || names+=("$pkg")
          done
          echo "packages=$(jq -nc '$ARGS.positional' --args "${names[@]}")" | tee -a "$GITHUB_OUTPUT"

  test-packages:
    name: Test Python Packages
    needs: discover-packages
    strategy:
      matrix:
        # If on main (push) OR PR targeting main -> test on 3 OSes, else only ubuntu
        os: ${{ fromJson( (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]' ) }}
        package: ${{ fromJson(needs.discover-packages.outputs.packages) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and create venv
        run: |
          pip install uv
          uv venv

      - name: Install package dependencies
        run: uv pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build JS viewer
        working-directory: viewer
        run: |
          npm install
          npm run build

      - name: Check key package versions
        run: |
          echo "--- All installed packages (check bioio, zarr, imageio, dask versions) ---"
          uv pip freeze

      - name: Run tests
        run: uv run pytest -vv