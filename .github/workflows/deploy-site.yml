name: Deploy to GitHub Pages

# main    -> docs "dev" version only.
# vX.Y.Z  -> docs version X.Y.Z (alias "latest") plus landing page and viewer.
# GitHub Pages serves the gh-pages branch: mike owns docs/, the root is ours.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'viewer/**'
      - 'packages/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MIKE_PREFIX: --deploy-prefix docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mike needs the gh-pages history

      # 1. Build the JS viewer first — the vite build syncs viewer/dist/ into
      #    packages/pixel-patrol-base/src/pixel_patrol_base/viewer_dist/ so the
      #    Python package install in the next step picks up the fresh build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build JS viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build

      # 2. Install pixel-patrol (the set users get) after the viewer is built.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4

      - name: Install Python packages
        run: uv pip install --system -e packages/pixel-patrol mkdocs-material mike "mkdocs<2"

      # 3. Regenerate the interactive schema/plugin reference from the installed
      #    plugins (the widget metadata is read from the JS plugins via Node,
      #    which is already on PATH from the viewer build above).
      - name: Generate schema reference
        run: python docs/gen_schema_docs.py

      # 3b. Inject the supported-extensions list into the landing page
      #     (parses SUPPORTED_EXTENSIONS from source, no extra installs needed).
      - name: Generate extensions list
        run: python docs/gen_extensions_docs.py

      # 4. Commit the versioned docs to the local gh-pages branch with mike
      #    ("latest" is a redirect alias: GitHub Pages does not serve symlinks).
      #    Everything is pushed once at the end, so Pages runs a single build.
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs (dev)
        if: github.ref_type == 'branch'
        run: mike deploy $MIKE_PREFIX dev

      - name: Deploy docs (release)
        if: github.ref_type == 'tag'
        run: |
          mike deploy $MIKE_PREFIX --alias-type redirect --update-aliases "${GITHUB_REF_NAME#v}" latest
          mike set-default $MIKE_PREFIX latest

      # 5. Releases only: assemble the landing page + viewer (the site minus
      #    docs/) and sync it into the gh-pages root, leaving docs/ to mike.
      - name: Assemble site
        if: github.ref_type == 'tag'
        run: |
          mkdocs build --site-dir gh-pages-site/docs
          python -c "
          from pixel_patrol_base.viewer_pages import build_github_pages_site
          build_github_pages_site('gh-pages-site')
          "

      - name: Publish landing page and viewer
        if: github.ref_type == 'tag'
        run: |
          git worktree add gh-pages-branch gh-pages
          rsync -a --delete \
            --exclude=/docs --exclude=/.git --exclude=/.nojekyll --exclude=/CNAME \
            gh-pages-site/ gh-pages-branch/
          cd gh-pages-branch
          git add -A
          git diff --cached --quiet || git commit -m "Update landing page and viewer for ${GITHUB_REF_NAME}"

      - name: Push gh-pages
        run: git push origin gh-pages
