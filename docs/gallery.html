  <style>
    /* Hero */
    .hero { padding: 80px 0 40px; background: radial-gradient(1200px 400px at 50% -100px, #e8efff 0%, #fff 70%); }
    .hero-label { text-transform: uppercase; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; color: #2563eb; margin-bottom: 12px; }
    .hero-title { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 16px; }
    .hero-lead { font-size: 1.05rem; line-height: 1.8; color: #495057; max-width: 680px; margin: 0 auto; }

    /* Filters */
    .gallery-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 28px 0 0; }
    .gallery-chip { border: 1px solid #dee2e6; background: #fff; color: #495057; border-radius: 999px; padding: 6px 16px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all .15s; }
    .gallery-chip:hover { border-color: #2563eb; color: #2563eb; }
    .gallery-chip.active { background: #2563eb; border-color: #2563eb; color: #fff; }

    /* Cards */
    .gallery { padding: 24px 0 88px; }
    .g-card { display: flex; flex-direction: column; height: 100%; border: 1px solid #dee2e6; border-radius: 14px; overflow: hidden; background: #fff; text-decoration: none; color: inherit; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .g-card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(37, 99, 235, 0.14); border-color: #b6ccff; color: inherit; }
    .g-media { position: relative; aspect-ratio: 16/10; overflow: hidden; background: linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(135deg, #dbe7ff 0%, #f1f5ff 55%, #e4ecff 100%); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #e9ecef; }
    .g-media img { width: 100%; height: 100%; object-fit: cover; object-position: top left; transition: transform .35s; }
    .g-card:hover .g-media img { transform: scale(1.04); }
    .g-media img.g-placeholder { width: 76px; height: 76px; border-radius: 18px; object-fit: contain; background: #fff; padding: 10px; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18); }
    .g-card:hover .g-media img.g-placeholder { transform: none; }
    .g-field { position: absolute; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.92); color: #2563eb; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
    .g-body { display: flex; flex-direction: column; flex: 1; padding: 20px; }
    .g-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; transition: color .2s; }
    .g-card:hover .g-title { color: #2563eb; }
    .g-desc { font-size: 0.9rem; line-height: 1.6; color: #6c757d; margin-bottom: 14px; }
    .g-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .g-tag { font-size: 0.75rem; color: #495057; background: #f1f3f5; border-radius: 6px; padding: 2px 8px; }
    .g-credit { font-size: 0.78rem; color: #9ca3af; font-style: italic; }
  </style>
</head>
<body>

      <i class="bi bi-list" style="font-size:1.5rem;color:#6c757d"></i>

    <div class="collapse navbar-collapse pp-nav-open" id="ppNav">
      <div class="d-flex flex-column flex-md-row ms-auto gap-3 gap-md-4 align-items-md-center py-3 py-md-0">
        <a class="pp-nav-link" href="./why.html">Why?</a>

        <a class="pp-nav-link" href="./docs/latest/tutorials/">Tutorials</a>

      </div>
    </div>
  </div>
</nav>

<section class="hero text-center">
  <div class="container">
    <div class="hero-label">Gallery</div>
    <h1 class="hero-title">Example reports</h1>
    <p class="hero-lead">Explore PixelPatrol reports of real datasets.</p>
    <div class="gallery-filters" id="filters" role="group" aria-label="Filter by field"></div>
  </div>

<section class="gallery">
  <div class="container">
    <div class="row g-4" id="grid"></div>
  </div>

<footer class="pp-footer">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Entries live in assets/gallery.json; add a report by adding an object there.
const grid = document.getElementById('grid');
const filters = document.getElementById('filters');

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text) node.textContent = text;
  return node;
};

function card(entry) {
  const root = el('a', 'g-card');
  root.href = entry.report;
  root.target = '_blank';
  root.rel = 'noopener';

  const media = el('div', 'g-media');
  if (entry.image) {
    const img = el('img');
    img.src = entry.image;
    img.alt = entry.title;
    img.loading = 'lazy';
    media.append(img);
  } else {
    const logo = el('img', 'g-placeholder');
    logo.src = 'assets/icon.png';
    logo.alt = '';
    media.append(logo);
  }
  media.append(el('span', 'g-field', entry.field));

  const body = el('div', 'g-body');
  body.append(el('div', 'g-title', entry.title), el('p', 'g-desc', entry.description));
  if (entry.tags?.length) {
    const tags = el('div', 'g-tags');
    entry.tags.forEach(t => tags.append(el('span', 'g-tag', t)));
    body.append(tags);
  }
  if (entry.credit) body.append(el('div', 'g-credit', entry.credit));

  root.append(media, body);
  const col = el('div', 'col-12 col-md-6 col-lg-4');
  col.dataset.field = entry.field;
  col.append(root);
  return col;
}

function render(entries) {
  entries.forEach(e => grid.append(card(e)));

  const fields = ['All', ...new Set(entries.map(e => e.field))];
  fields.forEach((field, i) => {
    const chip = el('button', 'gallery-chip' + (i === 0 ? ' active' : ''), field);
    chip.type = 'button';
    chip.addEventListener('click', () => {
      filters.querySelectorAll('.gallery-chip').forEach(c => c.classList.toggle('active', c === chip));
      grid.querySelectorAll('[data-field]').forEach(col => {
        col.hidden = field !== 'All' && col.dataset.field !== field;
      });
    });
    filters.append(chip);
  });
  if (fields.length <= 2) filters.hidden = true;
}

fetch('assets/gallery.json')
  .then(r => r.json())
  .then(render)
  .catch(() => grid.append(el('p', 'text-center text-muted', 'Could not load the gallery.')));
</script>
</body>
</html>
