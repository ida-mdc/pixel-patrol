# One table per dataset. `kind` decides how prepare.py fetches it.
#   zip : single zip over HTTP(S); --sample reads single members via range requests (no full download)
#   hf  : Hugging Face dataset repo (allow = glob patterns to fetch)
# Every entry mirrors a card spec in ../specs (same slug); citation/licence live there, not here.

[eurosat-ms]
kind = "zip"
url = "https://zenodo.org/api/records/7711810/files/EuroSAT_MS.zip/content"
loader = "geospatial"
extensions = ["tif"]
sample = "EuroSAT_MS/*/*.tif"
pp_args = []

[celegans-nuclei]
kind = "zip"
url = "https://zenodo.org/api/records/6460303/files/mskcc_confocal.zip/content"
loader = "bioio"
extensions = ["tif"]
sample = "mskcc-confocal/*/*.tif"
pp_args = ["--slice-size", "Z=-1"]   # one row per stack, not per Z plane (3 embryos x 400 timepoints)

[deepsea-mot]
kind = "hf"
repo = "MBARI-org/DeepSea-MOT"
allow = ["data/*/img1/*.jpg", "data/*/gt.txt", "data/*/seqinfo.ini"]
loader = "bioio"
extensions = ["jpg"]
pp_args = []
