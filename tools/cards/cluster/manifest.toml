# One table per dataset. `kind` decides how prepare.py fetches it.
#   7z  : .7z archives (downloaded to disk, extracted, then deleted; needs ~2x the archive size free at peak)
#   zip : single zip over HTTP(S); --sample reads single members via range requests (no full download)
#   tar : single .tar.gz over HTTP(S), streamed and extracted on the fly; --sample takes the first N files
#   hf  : Hugging Face dataset repo (allow = glob patterns to fetch)
# Every entry mirrors a card spec in ../specs (same slug); citation/licence live there, not here.

[eurosat-ms]
kind = "zip"
url = "https://zenodo.org/api/records/7711810/files/EuroSAT_MS.zip/content"
loader = "geospatial"
extensions = ["tif"]
sample = "EuroSAT_MS/*/*.tif"
pp_args = []

[celegans-nuclei]
kind = "zip"
url = "https://zenodo.org/api/records/6460303/files/mskcc_confocal.zip/content"
loader = "bioio"
extensions = ["tif"]
sample = "mskcc-confocal/*/*.tif"
pp_args = ["--slice-size", "Z=-1"]   # one row per stack, not per Z plane (3 embryos x 400 timepoints)

[deepsea-mot]
kind = "hf"
repo = "MBARI-org/DeepSea-MOT"
allow = ["data/*/images/*.jpg"]   # the annotated frames of all 11 sequences; .mov sources, labels and xml are not profiled
loader = "bioio"
extensions = ["jpg"]
pp_args = []

[caltech-camera-traps]
kind = "tar"
url = "https://storage.googleapis.com/public-datasets-lila/caltechcameratraps/cct_images.tar.gz"   # 112.5 GB: needs ~115 GB free
loader = "bioio"
extensions = ["jpg"]
pp_args = []

[medical-segmentation-decathlon]
kind = "tar"
# MONAI-hosted mirror of the 10 official task archives (~76 GB in total: needs ~80 GB free); same CC-BY-SA 4.0 licence.txt.
urls = [
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task01_BrainTumour.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task02_Heart.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task03_Liver.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task04_Hippocampus.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task05_Prostate.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task06_Lung.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task07_Pancreas.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task08_HepaticVessel.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task09_Spleen.tar",
  "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task10_Colon.tar",
]
loader = "nifti"
extensions = ["nii.gz"]
# images only: every task archive also holds labelsTr (masks), which are fetched but not profiled.
# One row per volume (Z=-1, T=-1): per-slice rows would be ~1M rows with thumbnails.
pp_args = ["--slice-size", "Z=-1", "--slice-size", "T=-1", "-p", "Task01_BrainTumour/imagesTr", "-p", "Task01_BrainTumour/imagesTs", "-p", "Task02_Heart/imagesTr", "-p", "Task02_Heart/imagesTs", "-p", "Task03_Liver/imagesTr", "-p", "Task03_Liver/imagesTs", "-p", "Task04_Hippocampus/imagesTr", "-p", "Task04_Hippocampus/imagesTs", "-p", "Task05_Prostate/imagesTr", "-p", "Task05_Prostate/imagesTs", "-p", "Task06_Lung/imagesTr", "-p", "Task06_Lung/imagesTs", "-p", "Task07_Pancreas/imagesTr", "-p", "Task07_Pancreas/imagesTs", "-p", "Task08_HepaticVessel/imagesTr", "-p", "Task08_HepaticVessel/imagesTs", "-p", "Task09_Spleen/imagesTr", "-p", "Task09_Spleen/imagesTs", "-p", "Task10_Colon/imagesTr", "-p", "Task10_Colon/imagesTs"]

[uxo-recordings]
kind = "7z"
# Only the record's "main dataset" archive (16.7 GB, ~19 GB unpacked, 74,437 .pgm sonar + 48,462 .jpg camera frames + json/csv).
# NOT included: data_export_polar.7z (74,437 polar-transformed .png of the same sonar frames) and data_processed.7z
# (64.9 GB: 98,937 unmatched .pgm + 98,937 .png + 228 .mp4). See specs/uxo-recordings.toml.
urls = ["https://zenodo.org/api/records/11068046/files/data_export_recordings.7z/content"]
loader = "bioio"
extensions = ["pgm", "jpg"]
pp_args = []
