[project]
name = "pixel-patrol-geospatial"
version = "0.1.0"
description = "Extension for geospatial data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pixel_patrol_base>=0.1.0",
    "rasterio",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_patrol_geospatial"]

[project.entry-points."pixel_patrol.loader_plugins"]
my_extension_loaders = "pixel_patrol_geospatial.plugin_registry:register_loader_plugins"

[project.entry-points."pixel_patrol.viewer_extensions"]
my_extension_viewer = "pixel_patrol_geospatial.plugin_registry:get_viewer_extension_dir"

[tool.uv.sources]
pixel-patrol-base = { path = "../../packages/pixel-patrol-base", editable = true }
